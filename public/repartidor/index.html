<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Repartos · Delicia China</title>
    <meta name="theme-color" content="#131718" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/css/estilos.css" />
    <link rel="stylesheet" href="/css/repartidor.css" />
  </head>
  <body class="repartidor" data-pantalla="cargando">
    <!-- Ingreso -->
    <section id="ingreso" class="r-ingreso" aria-labelledby="titulo-ingreso">
      <img src="/img/icono.png" alt="" width="88" height="88" />
      <h1 id="titulo-ingreso">Repartos</h1>
      <p class="r-sub">Delicia China · app del repartidor</p>
      <form id="form-ingreso" class="r-form" novalidate>
        <div id="ingreso-real">
          <div class="campo">
            <label for="i-correo">Correo</label>
            <input id="i-correo" type="email" autocomplete="username" />
          </div>
          <div class="campo">
            <label for="i-clave">Contraseña</label>
            <input id="i-clave" type="password" autocomplete="current-password" />
          </div>
        </div>
        <div id="ingreso-demo" class="campo" hidden>
          <label for="i-demo">¿Quién eres? <small>(modo demo)</small></label>
          <select id="i-demo"></select>
        </div>
        <p id="error-ingreso" class="error-campo" role="alert" hidden></p>
        <button id="entrar" type="submit" class="boton-principal">Entrar</button>
      </form>
    </section>

    <!-- Trabajo -->
    <div id="trabajo" class="r-trabajo">
      <header class="r-barra">
        <div class="r-marca">
          <img src="/img/icono.png" alt="" width="36" height="36" />
          <div>
            <strong id="mi-nombre">Repartidor</strong>
            <span id="etiqueta-demo" class="etiqueta-demo" hidden>Modo demo</span>
          </div>
        </div>
        <div class="r-acciones-barra">
          <button id="ver-mapa" type="button" class="r-boton-barra" aria-pressed="false">Mapa</button>
          <button id="actualizar" type="button" class="r-boton-barra" aria-label="Actualizar">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
              <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button id="salir" type="button" class="r-boton-barra">Salir</button>
        </div>
      </header>

      <main class="r-cuerpo">
        <section id="zona-mapa" class="r-zona-mapa" hidden aria-label="Mapa de pedidos">
          <div id="mapa-reparto" class="r-mapa"></div>
          <p class="nota">
            <span class="punto punto-local"></span> Local
            <span class="punto punto-mio"></span> Mis entregas
            <span class="punto punto-libre"></span> Para salir
          </p>
        </section>

        <section aria-labelledby="t-camino" class="r-seccion">
          <h2 id="t-camino">En camino <span class="r-cuenta" id="cuenta-camino">0</span></h2>
          <ul id="lista-camino" class="r-lista"></ul>
          <p id="vacio-camino" class="r-vacio">No llevas pedidos en este momento.</p>
        </section>

        <section aria-labelledby="t-salir" class="r-seccion">
          <h2 id="t-salir">Para salir <span class="r-cuenta" id="cuenta-salir">0</span></h2>
          <ul id="lista-salir" class="r-lista"></ul>
          <p id="vacio-salir" class="r-vacio">No hay pedidos listos. Esta pantalla se actualiza sola.</p>
        </section>

        <details class="r-seccion r-entregados" id="seccion-entregados">
          <summary>Entregados hoy <span class="r-cuenta" id="cuenta-entregados">0</span></summary>
          <ul id="lista-entregados" class="r-lista-simple"></ul>
        </details>

        <p class="nota centrada" id="ultima-actualizacion"></p>
      </main>
    </div>

    <div id="aviso" class="toast" role="status" hidden></div>

    <script type="module" src="/js/repartidor.js"></script>
  </body>
</html>
